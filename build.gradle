plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.release = 17
}

jar {
    manifest {
        attributes 'Main-Class': 'org.example.MyDualBot'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'paser-rubli-otzivi'
    // Исключаем файлы подписей, которые могут конфликтовать при верификации JAR
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.EC'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.0'

    implementation 'com.github.pengrad:java-telegram-bot-api:7.11.0'
    implementation 'org.telegram:telegrambots:6.9.7.1'

    implementation 'org.json:json:20231013'
    implementation 'org.jsoup:jsoup:1.15.4'

    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Selenium (Firefox) для получения cookies при старте
    implementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
    implementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.15.0'
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.2'
}

test {
    useJUnitPlatform()
    // Запускаем тесты в том же процессе, чтобы избежать проблем с worker
    maxParallelForks = 1
    forkEvery = 0
    // Увеличиваем память для тестов
    minHeapSize = "128m"
    maxHeapSize = "512m"
}

task collectCategoryJsons(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.CategoryJsonCollector'
}

task analyzeCategoryJsons(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.JsonAnalyzer'
}

task checkJsonParsing(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.JsonParserChecker'
}

// Альтернативный способ запуска тестов, если Gradle Test Executor не работает
task runTests(type: JavaExec) {
    group = 'verification'
    description = 'Run tests directly via TestRunner (workaround for Gradle Test Executor issues)'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'org.example.TestRunner'
    // Передаём все системные свойства в JVM процесс
    systemProperties = System.getProperties()
}

