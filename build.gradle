plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    implementation 'com.github.pengrad:java-telegram-bot-api:7.11.0'
    implementation 'org.telegram:telegrambots:6.9.7.1'

    implementation 'org.json:json:20231013'
    implementation 'org.jsoup:jsoup:1.15.4'

    implementation 'org.slf4j:slf4j-simple:2.0.12'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Для чтения cookies из браузерных баз данных (SQLite)
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
    
    // Для распаковки Brotli сжатия (используется Wildberries API)
    implementation 'com.aayushatharva.brotli4j:brotli4j:1.12.0'
    implementation 'com.aayushatharva.brotli4j:native-windows-x86_64:1.12.0'
}

test {
    useJUnitPlatform()
}


