plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.release = 17
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName = 'paser-rubli-otzivi'
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'org.example.MyDualBot'
    }
    mergeServiceFiles()
}

jar {
    manifest {
        attributes 'Main-Class': 'org.example.MyDualBot'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'paser-rubli-otzivi'
    // Исключаем файлы подписей, которые могут конфликтовать при верификации JAR
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.EC'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-console:1.10.0'

    implementation 'com.github.pengrad:java-telegram-bot-api:7.11.0'
    implementation 'org.telegram:telegrambots:6.9.7.1'

    implementation 'org.jsoup:jsoup:1.15.4'
    // Use logback (SLF4J backend) so we can write logs to parser.log via logback.xml
    implementation 'ch.qos.logback:logback-classic:1.5.12'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'com.google.code.gson:gson:2.10.1'
}


test {
    useJUnitPlatform()
    // Запускаем тесты в том же процессе, чтобы избежать проблем с worker
    maxParallelForks = 1
    forkEvery = 0
    // Увеличиваем память для тестов
    minHeapSize = "128m"
    maxHeapSize = "512m"
    // Запускаем тесты в том же процессе (in-process)
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    systemProperty 'wb.live.tests', System.getProperty('wb.live.tests', 'false')
}

task collectCategoryJsons(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.CategoryJsonCollector'
}

task analyzeCategoryJsons(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.JsonAnalyzer'
}

task checkJsonParsing(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.JsonParserChecker'
}

// Запуск теста ProductParsingIntegrationTest напрямую через JUnit Platform
task runBot(type: JavaExec) {
    group = 'application'
    description = 'Run Telegram Wildberries parser bot'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.MyDualBot'
}

task runProductParsingTest(type: JavaExec) {
    group = 'verification'
    description = 'Run ProductParsingIntegrationTest directly'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'org.junit.platform.console.ConsoleLauncher'
    args = [
        '--select-class', 'org.example.ProductParsingIntegrationTest',
        '--details', 'verbose'
    ]
    systemProperties = System.getProperties()
}

